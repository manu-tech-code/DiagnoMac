name: DiagnoMac
options:
  bundleIdPrefix: com.amalitech
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
targets:
  DiagnoMac:
    type: application
    platform: macOS
    sources:
      - path: DiagnoMac
    info:
      path: DiagnoMac/Resources/Info.plist
      properties:
        CFBundleDisplayName: DiagnoMac
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "© 2026 Emmanuel Larbi"
    entitlements:
      path: DiagnoMac/Resources/DiagnoMac.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amalitech.DiagnoMac
        GENERATE_INFOPLIST_FILE: NO
