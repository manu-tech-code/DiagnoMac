<title>DiagnoMac Icon Concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Schibsted+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: a design review board. Each concept gets a desktop-wallpaper stage for the full icon,
   then the same icon at real Dock and Finder sizes on light and dark strips. A shared Dock row compares all six. */
:root {
  --bg: #eceff4;
  --panel: #fbfcfe;
  --ink: #131824;
  --muted: #5c6577;
  --line: #d7dce6;
  --accent: #2844d2;
  --accent-soft: #e1e7fd;
  --stage: linear-gradient(160deg, #dfe6f3 0%, #c9d4ea 55%, #b8c6e2 100%);
  --strip-light: #f4f6fa;
  --strip-dark: #1d222c;
  --on-accent: #ffffff;
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Schibsted Grotesk", -apple-system, "Helvetica Neue", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1116; --panel: #161a21; --ink: #e6eaf1; --muted: #8d97a8; --line: #262c37;
    --accent: #8299ff; --accent-soft: #1e2647; --on-accent: #0e1116;
    --stage: linear-gradient(160deg, #1b2233 0%, #141a28 55%, #0f131d 100%);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1116; --panel: #161a21; --ink: #e6eaf1; --muted: #8d97a8; --line: #262c37;
  --accent: #8299ff; --accent-soft: #1e2647; --on-accent: #0e1116;
  --stage: linear-gradient(160deg, #1b2233 0%, #141a28 55%, #0f131d 100%);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body); }
.wrap { max-width: 1160px; margin: 0 auto; padding-inline: 20px; padding-block: 36px 64px; }
header { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: flex-end; justify-content: space-between; margin-bottom: 28px; }
h1 { font: 700 clamp(28px, 4vw, 40px)/1.05 var(--f-display); letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
header p { margin: 8px 0 0; color: var(--muted); max-width: 60ch; }
.pick-note { font-size: 13.5px; color: var(--muted); }
.pick-note b { color: var(--ink); }

.dock-compare { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin-bottom: 28px; }
.dock-compare h2, .card h2 { font: 600 12px/1.3 var(--f-body); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 12px; }
.docks { display: grid; gap: 12px; }
.dock { display: flex; gap: 14px; justify-content: center; align-items: flex-end; padding: 10px 16px; border-radius: 18px; overflow-x: auto; }
.dock.light { background: rgba(255,255,255,0.55); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06); }
.dock.dark { background: rgba(20,24,32,0.82); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); }
.dock-wall { border-radius: 12px; padding: 18px 12px 12px; background: var(--stage); }
.dock-wall.night { background: linear-gradient(160deg, #2a3350, #11151f); }
.dock svg { width: 64px; height: 64px; flex: none; }

.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.card.picked { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.stage { background: var(--stage); display: grid; place-items: center; padding: 26px 16px 18px; }
.stage svg { width: min(240px, 60vw); height: auto; display: block; max-width: 100%; }
.body { padding: 16px 20px 20px; display: grid; gap: 12px; flex: 1; }
.title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.title h3 { font: 700 22px/1.1 var(--f-display); margin: 0; letter-spacing: -0.01em; }
.tag { font-size: 12px; color: var(--muted); }
.idea { color: var(--muted); margin: 0; max-width: 60ch; }
.sizes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.strip { border-radius: 10px; padding: 12px; display: flex; align-items: flex-end; justify-content: space-around; gap: 6px; min-width: 0; }
.strip.light { background: var(--strip-light); box-shadow: inset 0 0 0 1px var(--line); }
.strip.dark { background: var(--strip-dark); }
.strip figure { margin: 0; display: grid; justify-items: center; gap: 4px; }
.strip figcaption { font: 10.5px var(--f-mono); color: #8a93a4; font-variant-numeric: tabular-nums; }
.strip svg { display: block; }
.s128 { width: 64px; height: 64px; } /* shown at half size: 128 px on a Retina display */
.s64 { width: 32px; height: 32px; }
.s32 { width: 16px; height: 16px; }
.s16 { width: 8px; height: 8px; }
.actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: auto; }
button { font: 600 14px var(--f-body); border-radius: 10px; padding: 9px 16px; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.copied { font-size: 13px; color: var(--muted); }
@media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
@media (max-width: 460px) { .sizes { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>DiagnoMac icon concepts</h1>
      <p>Six directions for the app icon, each drawn on macOS's icon grid. The strips show real Dock and Finder sizes, where most icons succeed or fail. Pick one and tell me its name in the chat.</p>
    </div>
    <div class="pick-note" id="pickNote" aria-live="polite">Nothing picked yet.</div>
  </header>

  <section class="dock-compare" aria-label="All six in the Dock">
    <h2>All six in the Dock</h2>
    <div class="docks">
      <div class="dock-wall"><div class="dock light" id="dockLight"></div></div>
      <div class="dock-wall night"><div class="dock dark" id="dockDark"></div></div>
    </div>
  </section>

  <div class="grid" id="grid"></div>
</div>

<script>
/* Each icon is drawn on Apple's 1024 grid: an 824-point body with a 100-point margin. */
let uid = 0;
const body = 'x="100" y="100" width="824" height="824" rx="185"';
const shadow = (id) => `<filter id="${id}" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".32"/></filter>`;
const glow = (id, sd = 16) => `<filter id="${id}" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="${sd}" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;
const pulse = "182,539 375,539 443,361 553,690 622,539 842,539";

const CONCEPTS = [
  {
    key: "pulse", name: "Pulse", tag: "Today's icon, refined",
    idea: "The heartbeat on a cobalt screen grid. Reads instantly as health and as a monitor. Simple enough to stay sharp at 16 pixels.",
    svg: (u) => `<svg viewBox="0 0 1024 1024" role="img" aria-label="Pulse icon"><defs>
      <linearGradient id="bg${u}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A6BFF"/><stop offset=".55" stop-color="#2844D2"/><stop offset="1" stop-color="#16248F"/></linearGradient>
      <linearGradient id="sh${u}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient>
      ${shadow("ds" + u)}${glow("gl" + u, 18)}<clipPath id="cl${u}"><rect ${body}/></clipPath></defs>
      <rect ${body} fill="url(#bg${u})" filter="url(#ds${u})"/>
      <g clip-path="url(#cl${u})">
        <path d="M237 100V924M375 100V924M512 100V924M649 100V924M787 100V924M100 237H924M100 375H924M100 512H924M100 649H924M100 787H924" stroke="#fff" stroke-opacity=".08" stroke-width="6"/>
        <rect ${body} fill="url(#sh${u})"/>
        <polyline points="${pulse}" fill="none" stroke="#fff" stroke-width="64" stroke-linecap="round" stroke-linejoin="round" filter="url(#gl${u})"/>
      </g>
      <rect ${body} fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="4"/></svg>`
  },
  {
    key: "checkup", name: "Checkup", tag: "Literal",
    idea: "A MacBook with a green heartbeat on its screen: this app checks your Mac. The light tile stands out in a mostly dark Dock.",
    svg: (u) => `<svg viewBox="0 0 1024 1024" role="img" aria-label="Checkup icon"><defs>
      <linearGradient id="bg${u}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCE3F1"/></linearGradient>
      <linearGradient id="sc${u}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#25305A"/><stop offset="1" stop-color="#121833"/></linearGradient>
      <linearGradient id="base${u}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D5DCEA"/><stop offset="1" stop-color="#A7B1C6"/></linearGradient>
      ${shadow("ds" + u)}${glow("gl" + u, 12)}</defs>
      <rect ${body} fill="url(#bg${u})" filter="url(#ds${u})"/>
      <rect x="226" y="286" width="572" height="372" rx="38" fill="url(#sc${u})" stroke="#C4CCDD" stroke-width="18"/>
      <path d="M150 676H874L846 716Q838 728 822 728H202Q186 728 178 716Z" fill="url(#base${u})"/>
      <rect x="462" y="676" width="100" height="16" rx="8" fill="#9AA4BA"/>
      <polyline points="290,472 418,472 462,380 534,566 574,472 734,472" fill="none" stroke="#3AD08A" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" filter="url(#gl${u})"/>
      <rect ${body} fill="none" stroke="#000" stroke-opacity=".06" stroke-width="4"/></svg>`
  },
  {
    key: "dial", name: "Health Dial", tag: "The score",
    idea: "A gauge with its needle in the green, the way the app sums up your Mac. The traffic-light arc says good, attention and fix now at a glance.",
    svg: (u) => `<svg viewBox="0 0 1024 1024" role="img" aria-label="Health Dial icon"><defs>
      <linearGradient id="bg${u}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2D3548"/><stop offset="1" stop-color="#10141C"/></linearGradient>
      ${shadow("ds" + u)}${glow("gl" + u, 10)}</defs>
      <rect ${body} fill="url(#bg${u})" filter="url(#ds${u})"/>
      <path d="M253 577A260 260 0 0 1 374 380" fill="none" stroke="#34C77B" stroke-width="72"/>
      <path d="M394 368A260 260 0 0 1 630 368" fill="none" stroke="#F2B544" stroke-width="72"/>
      <path d="M650 380A260 260 0 0 1 771 577" fill="none" stroke="#EF6A5F" stroke-width="72"/>
      <line x1="512" y1="600" x2="348" y2="485" stroke="#fff" stroke-width="28" stroke-linecap="round"/>
      <circle cx="512" cy="600" r="46" fill="#fff"/><circle cx="512" cy="600" r="18" fill="#2D3548"/>
      <polyline points="380,770 452,770 478,724 516,812 540,770 644,770" fill="none" stroke="#6F8BFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#gl${u})"/>
      <rect ${body} fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="4"/></svg>`
  },
  {
    key: "silicon", name: "Silicon", tag: "The hardware",
    idea: "An Apple-silicon-style chip with a pulse across its die. It says the app looks deep inside the Mac, at the chip, GPU and memory.",
    svg: (u) => {
      const pins = [];
      for (let i = 0; i < 6; i++) {
        const p = 337 + i * 70;
        pins.push(`<rect x="${p}" y="222" width="26" height="80" rx="11"/>`, `<rect x="${p}" y="722" width="26" height="80" rx="11"/>`,
                  `<rect x="222" y="${p}" width="80" height="26" rx="11"/>`, `<rect x="722" y="${p}" width="80" height="26" rx="11"/>`);
      }
      return `<svg viewBox="0 0 1024 1024" role="img" aria-label="Silicon icon"><defs>
      <linearGradient id="bg${u}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22306A"/><stop offset="1" stop-color="#0A0F26"/></linearGradient>
      <linearGradient id="chip${u}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F1F4FA"/><stop offset="1" stop-color="#9FAAC0"/></linearGradient>
      <linearGradient id="ln${u}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7DEBFF"/><stop offset="1" stop-color="#6F8BFF"/></linearGradient>
      ${shadow("ds" + u)}${glow("gl" + u, 12)}</defs>
      <rect ${body} fill="url(#bg${u})" filter="url(#ds${u})"/>
      <g fill="#A6B0C6">${pins.join("")}</g>
      <rect x="292" y="292" width="440" height="440" rx="62" fill="url(#chip${u})"/>
      <rect x="350" y="350" width="324" height="324" rx="30" fill="#0E1532" stroke="#ffffff" stroke-opacity=".2" stroke-width="4"/>
      <polyline points="378,512 456,512 484,438 536,592 562,512 646,512" fill="none" stroke="url(#ln${u})" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#gl${u})"/>
      <rect ${body} fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="4"/></svg>`;
    }
  },
  {
    key: "lens", name: "Lens", tag: "Liquid Glass",
    idea: "A glass magnifier over the heartbeat, enlarging it: diagnosis as a closer look. The translucent glass matches macOS's newer icon style.",
    svg: (u) => `<svg viewBox="0 0 1024 1024" role="img" aria-label="Lens icon"><defs>
      <linearGradient id="bg${u}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5C7CFF"/><stop offset="1" stop-color="#1D36B8"/></linearGradient>
      <radialGradient id="gl-fill${u}" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".34"/><stop offset="1" stop-color="#fff" stop-opacity=".08"/></radialGradient>
      ${shadow("ds" + u)}${glow("gl" + u, 14)}
      <clipPath id="lc${u}"><circle cx="468" cy="468" r="214"/></clipPath></defs>
      <rect ${body} fill="url(#bg${u})" filter="url(#ds${u})"/>
      <polyline points="${pulse}" fill="none" stroke="#fff" stroke-opacity=".38" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="636" y1="636" x2="806" y2="806" stroke="#0F1E73" stroke-opacity=".45" stroke-width="86" stroke-linecap="round"/>
      <line x1="636" y1="636" x2="800" y2="800" stroke="#EEF2FF" stroke-width="66" stroke-linecap="round"/>
      <circle cx="468" cy="468" r="214" fill="url(#gl-fill${u})"/>
      <g clip-path="url(#lc${u})"><polyline points="${pulse}" transform="translate(468 468) scale(1.45) translate(-468 -468)" fill="none" stroke="#fff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" filter="url(#gl${u})"/></g>
      <circle cx="468" cy="468" r="214" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="26"/>
      <path d="M318 380A180 180 0 0 1 400 300" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="14" stroke-linecap="round"/>
      <rect ${body} fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="4"/></svg>`
  },
  {
    key: "ring", name: "Score Ring", tag: "The app's own mark",
    idea: "The health-score ring from the Overview with the pulse inside. It ties the icon to the first thing you see in the app.",
    svg: (u) => `<svg viewBox="0 0 1024 1024" role="img" aria-label="Score Ring icon"><defs>
      <linearGradient id="bg${u}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E3E9F6"/></linearGradient>
      <linearGradient id="rg${u}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5C7CFF"/><stop offset="1" stop-color="#16248F"/></linearGradient>
      ${shadow("ds" + u)}</defs>
      <rect ${body} fill="url(#bg${u})" filter="url(#ds${u})"/>
      <circle cx="512" cy="512" r="250" fill="none" stroke="#D8E0F0" stroke-width="88"/>
      <circle cx="512" cy="512" r="250" fill="none" stroke="url(#rg${u})" stroke-width="88" stroke-linecap="round" stroke-dasharray="1351 1571" transform="rotate(-90 512 512)"/>
      <polyline points="372,512 452,512 482,436 538,594 566,512 652,512" fill="none" stroke="#2844D2" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
      <rect ${body} fill="none" stroke="#000" stroke-opacity=".06" stroke-width="4"/></svg>`
  }
];

const icon = (c, cls = "") => c.svg(++uid).replace("<svg ", `<svg class="${cls}" `);

let picked = null;
try { picked = localStorage.getItem("dm-icon-pick"); } catch (e) {}

function render() {
  document.getElementById("dockLight").innerHTML = CONCEPTS.map(c => icon(c)).join("");
  document.getElementById("dockDark").innerHTML = CONCEPTS.map(c => icon(c)).join("");
  document.getElementById("grid").innerHTML = CONCEPTS.map(c => `
    <article class="card ${picked === c.key ? "picked" : ""}" id="card-${c.key}">
      <div class="stage">${icon(c)}</div>
      <div class="body">
        <div class="title"><h3>${c.name}</h3><span class="tag">${c.tag}</span></div>
        <p class="idea">${c.idea}</p>
        <div class="sizes">
          ${["light", "dark"].map(t => `<div class="strip ${t}">
            ${[["s128", "128"], ["s64", "64"], ["s32", "32"], ["s16", "16"]].map(([cls, label]) => `<figure>${icon(c, cls)}<figcaption>${label}</figcaption></figure>`).join("")}
          </div>`).join("")}
        </div>
        <div class="actions">
          <button class="${picked === c.key ? "primary" : ""}" data-pick="${c.key}" id="pick-${c.key}">${picked === c.key ? "Picked" : "Pick " + c.name}</button>
          ${picked === c.key ? `<button data-copy="${c.name}" id="copy-${c.key}">Copy "Use the ${c.name} icon"</button><span class="copied" id="copied-${c.key}"></span>` : ""}
        </div>
      </div>
    </article>`).join("");
  const note = document.getElementById("pickNote");
  const chosen = CONCEPTS.find(c => c.key === picked);
  note.innerHTML = chosen ? `Picked: <b>${chosen.name}</b>. Tell me “Use the ${chosen.name} icon” in the chat.` : "Nothing picked yet.";
}

document.addEventListener("click", e => {
  const pick = e.target.closest("[data-pick]");
  if (pick) {
    picked = picked === pick.dataset.pick ? null : pick.dataset.pick;
    try { picked ? localStorage.setItem("dm-icon-pick", picked) : localStorage.removeItem("dm-icon-pick"); } catch (err) {}
    render();
    const btn = document.getElementById("pick-" + pick.dataset.pick);
    if (btn) btn.focus();
    return;
  }
  const copy = e.target.closest("[data-copy]");
  if (copy) {
    const text = `Use the ${copy.dataset.copy} icon`;
    const status = copy.nextElementSibling;
    navigator.clipboard.writeText(text).then(() => { if (status) status.textContent = "Copied. Paste it in the chat."; })
      .catch(() => { if (status) status.textContent = text; });
  }
});

render();
</script>
