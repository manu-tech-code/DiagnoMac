<style>
/* Layout: instrument-panel app shell. Fixed sidebar of check areas, one area at a time in the main pane. Collapses to a scrolling tab strip on phones. */
:root {
  --bg: #e9edf1;
  --panel: #fbfcfd;
  --sunk: #f1f4f7;
  --ink: #141a21;
  --muted: #5b6672;
  --line: #d6dde4;
  --accent: #2844d2;
  --accent-soft: #e3e8fd;
  --ai: #7a3fd1;
  --ai-soft: #efe6fb;
  --ok: #1d8659;
  --ok-soft: #dff2e8;
  --warn: #a8670d;
  --warn-soft: #fbefd9;
  --crit: #c2342a;
  --crit-soft: #fbe3e0;
  --on-accent: #ffffff;
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Schibsted Grotesk", -apple-system, "Helvetica Neue", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1115; --panel: #151a20; --sunk: #10151a; --ink: #e5eaf0; --muted: #8b97a4; --line: #252d36;
    --accent: #8299ff; --accent-soft: #1d2547; --ai: #b68cff; --ai-soft: #271c3d; --ok: #42c08a; --ok-soft: #12291f;
    --warn: #e2a640; --warn-soft: #2d2311; --crit: #f06c61; --crit-soft: #321715; --on-accent: #0d1115; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1115; --panel: #151a20; --sunk: #10151a; --ink: #e5eaf0; --muted: #8b97a4; --line: #252d36;
  --accent: #8299ff; --accent-soft: #1d2547; --ai: #b68cff; --ai-soft: #271c3d; --ok: #42c08a; --ok-soft: #12291f;
  --warn: #e2a640; --warn-soft: #2d2311; --crit: #f06c61; --crit-soft: #321715; --on-accent: #0d1115; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

.shell { display: grid; grid-template-columns: 232px 1fr; min-height: 100%; }
.side { border-right: 1px solid var(--line); padding: 20px 12px; display: flex; flex-direction: column; gap: 16px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.brand svg { flex: none; }
.brand b { font: 700 19px/1 var(--f-display); letter-spacing: -0.01em; }
.brand small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 3px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; border: 0; background: none; padding: 6px 10px; border-radius: 7px; color: var(--muted); font-weight: 500; }
.nav button:hover { background: var(--sunk); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.nav .new { font-size: 10px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ai); }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--ok); }
.dot.warn { background: var(--warn); } .dot.crit { background: var(--crit); } .dot.info { background: var(--accent); } .dot.none { background: transparent; }
.nav-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 0 10px; margin: 8px 0 2px; }
.side-foot { margin-top: auto; padding: 0 10px; font-size: 12px; color: var(--muted); display: grid; gap: 4px; }

main { padding: 28px clamp(16px, 4vw, 44px) 60px; min-width: 0; max-width: 1180px; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.head h1 { font: 700 clamp(24px, 3vw, 32px)/1.1 var(--f-display); margin: 0; letter-spacing: -0.015em; text-wrap: balance; }
.head p { margin: 6px 0 0; color: var(--muted); max-width: 64ch; }
.btn { border: 1px solid var(--line); background: var(--panel); padding: 7px 14px; border-radius: 8px; font-weight: 500; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.danger { background: var(--crit); border-color: var(--crit); color: var(--on-accent); }
.btn.ai { color: var(--ai); border-color: color-mix(in srgb, var(--ai) 35%, var(--line)); background: var(--ai-soft); }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); padding-inline: 8px; }
.btn.ghost:hover { color: var(--ink); background: var(--sunk); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }

.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.tiles { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; min-width: 0; }
.card h2 { font: 600 12.5px/1.3 var(--f-body); text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.card h2 .aside { text-transform: none; letter-spacing: 0; font-weight: 400; }
.span2 { grid-column: span 2; }
.span-all { grid-column: 1 / -1; }

.stat .v { font: 500 26px/1.1 var(--f-mono); letter-spacing: -0.02em; }
.stat .v small { font-size: 14px; color: var(--muted); margin-left: 3px; }
.stat .k { color: var(--muted); font-size: 12.5px; margin-top: 5px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.crit { background: var(--crit-soft); color: var(--crit); }
.pill.info { background: var(--accent-soft); color: var(--accent); }
.pill.ai { background: var(--ai-soft); color: var(--ai); }
.pill.sample { background: var(--sunk); color: var(--muted); border: 1px dashed var(--line); font-weight: 500; }
.pill.live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .25; } }

.kv { display: grid; grid-template-columns: auto 1fr; gap: 7px 18px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; }

/* Findings: grouped by severity, roomy rows */
.fgroup + .fgroup { margin-top: 22px; }
.fgroup-h { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; margin-bottom: 8px; }
.fgroup-h .count { color: var(--muted); font-weight: 400; }
.finding { display: grid; grid-template-columns: 38px 1fr auto; gap: 16px; align-items: start; padding: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.finding + .finding { margin-top: 10px; }
.finding .ic { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; }
.finding .ic.warn { background: var(--warn-soft); color: var(--warn); } .finding .ic.crit { background: var(--crit-soft); color: var(--crit); } .finding .ic.info { background: var(--accent-soft); color: var(--accent); }
.finding h3 { margin: 0; font: 600 15px/1.35 var(--f-body); }
.finding p { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }
.finding .meta { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--muted); }
.finding .acts { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
.explain { margin-top: 12px; padding: 12px 14px; border-radius: 8px; background: var(--ai-soft); border: 1px solid color-mix(in srgb, var(--ai) 25%, transparent); }
.explain .who { font-size: 12px; font-weight: 600; color: var(--ai); display: flex; gap: 6px; align-items: center; margin-bottom: 4px; }
.explain p { color: var(--ink); margin: 0; max-width: 72ch; }

.meter { height: 8px; border-radius: 99px; background: var(--sunk); overflow: hidden; display: flex; box-shadow: inset 0 0 0 1px var(--line); }
.meter i { display: block; height: 100%; transition: width .4s; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 12.5px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; background: var(--c); margin-right: 6px; vertical-align: -1px; }

table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; padding: 0 10px 8px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 10px 9px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.tw { overflow-x: auto; }
.trunc { max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
tr.confirm td { background: var(--crit-soft); }

.score { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
.score svg { flex: none; }
.score .num { font: 700 44px/1 var(--f-display); }
.score h3 { margin: 0 0 4px; font: 600 19px/1.25 var(--f-display); }
.score p { margin: 0; color: var(--muted); max-width: 52ch; }

.switch { position: relative; width: 34px; height: 20px; flex: none; display: inline-block; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch i { position: absolute; inset: 0; border-radius: 99px; background: var(--line); transition: background .15s; pointer-events: none; }
.switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--panel); transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.switch input:checked + i { background: var(--ok); }
.switch input:checked + i::after { transform: translateX(14px); }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--sunk); }
.seg button { border: 0; background: none; padding: 4px 10px; border-radius: 6px; color: var(--muted); font-size: 13px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }

.bars { display: grid; gap: 6px; align-items: end; height: 120px; }
.bar { display: flex; flex-direction: column; align-items: center; gap: 5px; height: 100%; justify-content: flex-end; }
.bar .col { width: 100%; background: var(--sunk); border-radius: 4px; flex: 1; position: relative; overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
.bar .col i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--accent); transition: height .5s; }
.bar small { font: 11px var(--f-mono); color: var(--muted); }
.spark { width: 100%; height: 80px; display: block; }

/* Battery charging visual */
.batt-hero { display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: center; }
.cell { position: relative; width: 150px; height: 74px; border: 3px solid var(--ink); border-radius: 14px; padding: 5px; }
.cell::after { content: ""; position: absolute; right: -11px; top: 22px; width: 6px; height: 24px; border-radius: 0 4px 4px 0; background: var(--ink); }
.cell .fill { height: 100%; border-radius: 8px; background: var(--ok); position: relative; overflow: hidden; transition: width .6s; }
.cell.charging .fill::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(115deg, transparent 0 14px, rgba(255,255,255,.28) 14px 26px); background-size: 60px 100%; animation: flow 1.1s linear infinite; }
@keyframes flow { to { background-position: 60px 0; } }
.cell .bolt { position: absolute; inset: 0; display: grid; place-items: center; }
.batt-hero h3 { margin: 0; font: 700 34px/1 var(--f-display); }
.batt-hero p { margin: 6px 0 0; color: var(--muted); }
.flow svg { width: 100%; height: auto; display: block; }
.flow .wire { fill: none; stroke-linecap: round; }
.flow .wire.anim { stroke-dasharray: 2 12; animation: dash 0.9s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -14; } }

/* Speed test */
.speed { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 20px; align-items: center; }
.gauge-num { font: 500 48px/1 var(--f-mono); letter-spacing: -0.03em; }
.gauge-num small { font-size: 16px; color: var(--muted); margin-left: 4px; }
.steps { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.step { font-size: 12.5px; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.step.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.step.done { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }
.progress { height: 6px; border-radius: 99px; background: var(--sunk); overflow: hidden; margin-top: 14px; box-shadow: inset 0 0 0 1px var(--line); }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s linear; }

/* Assistant */
.chat { display: flex; flex-direction: column; gap: 14px; }
.msg { max-width: 76ch; padding: 12px 14px; border-radius: 12px; }
.msg.me { align-self: flex-end; background: var(--accent); color: var(--on-accent); border-bottom-right-radius: 4px; }
.msg.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg.bot .who { font-size: 12px; font-weight: 600; color: var(--ai); margin-bottom: 4px; display: flex; gap: 6px; align-items: center; }
.msg .used { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; color: var(--muted); align-items: center; }
.msg .used span { border: 1px solid var(--line); border-radius: 99px; padding: 1px 8px; font-family: var(--f-mono); font-size: 11.5px; }
.ask { display: flex; gap: 8px; margin-top: 16px; }
.ask input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 10px 14px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 6px 12px; font-size: 13px; }
.chip:hover { border-color: var(--ai); color: var(--ai); }
.caret::after { content: "▍"; color: var(--ai); animation: blink 1s infinite; }

.kbd { display: flex; flex-direction: column; gap: 5px; overflow-x: auto; padding-bottom: 4px; }
.krow { display: flex; gap: 5px; }
.key { flex: var(--w, 1) 0 0; min-width: 30px; height: 34px; border: 1px solid var(--line); border-radius: 6px; background: var(--sunk); display: grid; place-items: center; font: 11px var(--f-mono); color: var(--muted); }
.key.down { background: var(--accent); color: var(--panel); border-color: var(--accent); }
.key.done { background: var(--ok-soft); color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }

.note { font-size: 12.5px; color: var(--muted); margin-top: 10px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 13.5px; z-index: 50; max-width: calc(100% - 32px); }
textarea.rep { width: 100%; min-height: 280px; font: 12.5px/1.55 var(--f-mono); background: var(--sunk); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 12px; resize: vertical; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.proposal { border: 1px dashed color-mix(in srgb, var(--ai) 45%, var(--line)); border-radius: var(--r); padding: 12px 16px; background: color-mix(in srgb, var(--ai-soft) 50%, var(--panel)); font-size: 13.5px; }
.proposal b { color: var(--ai); }

@media (max-width: 980px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .speed { grid-template-columns: 1fr; } }
@media (max-width: 760px) {
  .shell { grid-template-columns: 1fr; }
  .side { position: sticky; top: env(safe-area-inset-top, 0px); height: auto; z-index: 10; background: var(--bg); border-right: 0; border-bottom: 1px solid var(--line); padding: 12px 16px 8px; gap: 10px; }
  .nav { flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
  .nav button { white-space: nowrap; flex: none; }
  .nav-label, .side-foot { display: none; }
  .g2, .g3 { grid-template-columns: 1fr; }
  .span2 { grid-column: auto; }
  .finding { grid-template-columns: 38px 1fr; }
  .finding .acts { grid-column: 2; flex-direction: row; flex-wrap: wrap; }
  .batt-hero { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

const $ = s => document.querySelector(s);
const pill = (sev, txt) => `<span class="pill ${sev}">${txt}</span>`;
const SAMPLE = `<span class="pill sample" title="Illustrative. The app reads this from your Mac.">Sample</span>`;
const SIM = `<span class="pill sample" title="Animated to show the live view. Not a real reading.">Simulated live</span>`;
const AIPILL = `<span class="pill ai">${ICON.spark} On-device AI</span>`;
const open = () => ISSUES.filter(i => !STATE.fixed.has(i.id) && !(i.id === "apps" && STATE.quit.size >= 3));
function score() { return Math.max(0, 100 - open().reduce((s, i) => s + (i.sev === "crit" ? 12 : i.sev === "warn" ? 6 : 1), 0)); }
function sevOf(area) {
  const o = open().filter(i => i.area === area);
  if (o.some(i => i.sev === "crit")) return "crit";
  if (o.some(i => i.sev === "warn")) return "warn";
  if (o.some(i => i.sev === "info")) return "info";
  return ["report", "hardware", "assistant", "overview", "devices"].includes(area) ? "none" : "ok";
}
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; t.setAttribute("role", "status");
  document.body.appendChild(t); setTimeout(() => t.remove(), 2800);
}
function header(title, sub, actions = "") { return `<div class="head"><div><h1>${title}</h1><p>${sub}</p></div><div class="row">${actions}</div></div>`; }
function ring(val, size, col) {
  const r = size / 2 - 7, c = 2 * Math.PI * r, f = val / 100;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--sunk)" stroke-width="9"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c*f} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`;
}
function sparkSVG(id, series, max, color = "var(--accent)") {
  const n = Math.max(series.length, 2), pts = series.map((v, i) => `${(i * 300 / (n - 1)).toFixed(1)},${(76 - (v / max) * 70).toFixed(1)}`);
  const last = pts[pts.length - 1];
  return `<svg class="spark" id="${id}" viewBox="0 0 300 80" preserveAspectRatio="none" aria-hidden="true">
    <line x1="0" y1="41" x2="300" y2="41" stroke="var(--line)" stroke-dasharray="3 4"/>
    ${series.length > 1 ? `<polygon fill="color-mix(in srgb, ${color} 15%, transparent)" points="0,80 ${pts.join(" ")} ${last.split(",")[0]},80"/><polyline fill="none" stroke="${color}" stroke-width="1.8" points="${pts.join(" ")}"/><circle cx="${last.split(",")[0]}" cy="${last.split(",")[1]}" r="3.5" fill="${color}"/>` : ""}</svg>`;
}

const timers = [];
function stopTimers() { while (timers.length) clearInterval(timers.pop()); }
function renderNav() {
  $("#nav").innerHTML = VIEWS.map(([k, n, tag]) =>

}
function go(view, keepScroll) {
  STATE.view = view; try { localStorage.setItem("dm2-view", view); } catch (e) {}
  stopTimers(); renderNav(); $("#main").innerHTML = R[view](); after[view] && after[view]();
  if (!keepScroll) window.scrollTo(0, 0);
}
const rerender = () => go(STATE.view, true);

document.addEventListener("click", e => {
  const el = e.target.closest("[data-view],[data-fix],[data-explain],[data-quit],[data-confirm-quit],[data-cancel-quit],[data-ask],[data-filter],[data-charge]");
  if (!el) return;
  if (el.dataset.view) return go(el.dataset.view);
  if (el.dataset.fix) {
    const is = ISSUES.find(i => i.id === el.dataset.fix);
    if (is.id === "tm") { toast("Would open System Settings → Time Machine"); return; }
    return go(is.area);
  }
  if (el.dataset.explain) { STATE.explained.add(el.dataset.explain); rerender(); return; }
  if (el.dataset.quit) { STATE.pendingQuit = el.dataset.quit; rerender(); return; }
  if (el.dataset.cancelQuit !== undefined) { STATE.pendingQuit = null; rerender(); return; }
  if (el.dataset.confirmQuit) { STATE.quit.add(el.dataset.confirmQuit); STATE.pendingQuit = null; toast(`Would quit ${el.dataset.confirmQuit} (prototype)`); renderNav(); rerender(); return; }
  if (el.dataset.ask) { if (STATE.view !== "assistant") go("assistant"); ask(el.dataset.ask); return; }
  if (el.dataset.filter) { STATE.appFilter = el.dataset.filter; rerender(); return; }
  if (el.dataset.charge) { STATE.charging = el.dataset.charge === "1"; rerender(); return; }
});

}
function crExplain(n) {
  return ({ intelligencetasksd: "It's crashing with EXC_BAD_ACCESS inside an Apple Intelligence framework: it read memory it shouldn't. This is a bug in macOS and nothing on your side is wrong. Updating macOS is the fix.",

}

const ANSWERS = {
  "Why is my Mac slow?": { a: "Mostly memory. Swap is 68% full and macOS has written 25,917 pages to disk since you started up, so switching apps has to wait for the SSD. Teams, Slack, Outlook and Cliq are idle and hold 2.4 GB between them. The CPU is also busy: WindowServer is at 47%, driven by the external display and the Dynamic Island app. Quit the idle apps and Dynamic Island, then restart when you can.", used: ["memory", "topProcesses", "runningApps"] },
  "Is my battery healthy?": { a: "Yes. It's at 100% of its original capacity after 16 of its 1,000 rated cycles, and macOS reports its condition as Normal. It's charging at 34.2 W from your 70W adapter and will be full in about 20 minutes.", used: ["battery", "charger"] },
  "What can I safely delete?": { a: "About 8 GB of user caches are safe to clear; apps rebuild them. If you no longer use older iOS simulators, removing unavailable ones may free part of the 23.5 GB simulator folder. Don't delete Xcode archives if you ship apps, because you need them to read crash reports.", used: ["storage.cleanup"] },
  "Which apps should I quit?": { a: "Microsoft Teams (1.26 GB), Slack (0.48 GB), Outlook (0.35 GB) and Cliq (0.33 GB). They've used no CPU recently. Docker is also open with no containers running. Quitting all five frees about 2.7 GB, which is enough to stop swapping.", used: ["runningApps", "memory"] }
};
function ask(q) {
  q = q.trim(); if (!q) return;
  const hit = ANSWERS[q] || { a: "In the app, this question goes to Apple's on-device model, which looks up the relevant readings from your scan before answering. This prototype only has answers for the suggested questions.", used: [] };
  STATE.chat.push({ me: true, text: q.replace(/</g, "&lt;") });
  const m = { text: "", typing: true, used: hit.used };
  STATE.chat.push(m); rerender();
  const words = hit.a.split(" "); let i = 0;
  const t = setInterval(() => {
    i += 2; m.text = words.slice(0, i).join(" ");
    const el = [...document.querySelectorAll("[data-answer]")].pop();
    if (el && STATE.view === "assistant") el.textContent = m.text;
    if (i >= words.length) { clearInterval(t); m.typing = false; if (STATE.view === "assistant") rerender(); }
  }, 70);
}

/* ---------- Speed test simulation (runs across page changes) ---------- */
let speedTimer = null;
function startSpeed() {
  const s = STATE.speed; Object.assign(s, { running: true, phase: 0, t: 0, cur: 0, down: null, up: null, rpm: null, series: [] });
  rerender();
  speedTimer = setInterval(() => {
    s.t += 0.25;
    const target = s.phase === 0 ? 412 : s.phase === 1 ? 58 : 1450;
    const local = s.phase === 0 ? s.t : s.phase === 1 ? s.t - 10 : s.t - 16;
    s.cur = target * (1 - Math.exp(-local / 1.6)) * (0.92 + Math.random() * 0.12);
    if (s.phase < 2) { s.series.push(s.cur); if (s.series.length > 80) s.series.shift(); }
    if (s.phase === 0 && s.t >= 10) { s.down = 412; s.phase = 1; s.series = []; rerenderNet(); }
    else if (s.phase === 1 && s.t >= 16) { s.up = 58; s.phase = 2; rerenderNet(); }
    else if (s.phase === 2 && s.t >= 19) { s.rpm = 1450; s.running = false; clearInterval(speedTimer); toast("Speed test finished (simulated values)"); rerenderNet(); return; }
    if (STATE.view === "network") {
      $("#spBig").innerHTML = s.phase < 2 ? `${Math.round(s.cur)}<small>Mbps</small>` : `${Math.round(s.cur)}<small>RPM</small>`;
      $("#spProg").style.width = (s.t / 19 * 100) + "%";
      if (s.phase < 2) $("#spSpark").outerHTML = sparkSVG("spSpark", s.series, 500, s.phase === 1 ? "var(--ok)" : "var(--accent)");
      const lp = document.querySelector(".pill.live"); if (lp) lp.textContent = `Testing · ${Math.ceil(19 - s.t)} s left`;
    }
  }, 250);
}
function rerenderNet() { if (STATE.view === "network") rerender(); }

/* ---------- Post-render hooks ---------- */
const after = {
  overview() {
    timers.push(setInterval(() => {
      const c = $("#ovCpu"), g = $("#ovGpu");
      if (c) c.innerHTML = Math.round(20 + Math.random() * 10) + "<small>%</small>";
      if (g) g.innerHTML = Math.round(10 + Math.random() * 7) + "<small>%</small>";
    }, 1500));
  },
  assistant() {
    $("#askForm").onsubmit = e => { e.preventDefault(); const v = $("#askInput").value; $("#askInput").value = ""; ask(v); };
  },
  apps() {
    const b = $("#quitIdle");
    if (b) b.onclick = () => { D.apps.filter(a => a.cpu < 0.5 && !a.self && a.kind === "Window").forEach(a => STATE.quit.add(a.n)); toast("Would quit the idle apps (prototype)"); renderNav(); rerender(); };
  },
  battery() {
    if (!STATE.charging) return;
    const hist = Array.from({ length: 40 }, (_, i) => 52 - i * 0.35 + Math.random() * 3);
    const draw = () => { const w = $("#chgSpark"); if (w) w.innerHTML = sparkSVG("chg", hist, 60, "var(--ok)"); };
    draw();
    timers.push(setInterval(() => {
      hist.push(Math.max(20, hist[hist.length - 1] - 0.15 + (Math.random() - .5) * 2)); hist.shift(); draw();
      const bat = hist[hist.length - 1] * 0.69, sys = 15 + Math.random() * 1.5;
      const pb = $("#pfBat"), ps = $("#pfSys"), pi = $("#pfIn");
      if (pb) pb.textContent = "+" + bat.toFixed(1) + " W"; if (ps) ps.textContent = sys.toFixed(1) + " W"; if (pi) pi.textContent = (bat + sys + 1.4).toFixed(1) + " W";
    }, 1500));
  },
  performance() {
    const cpuH = Array.from({ length: 60 }, () => 20 + Math.random() * 12), gpuH = Array.from({ length: 60 }, () => 10 + Math.random() * 8);
    const tick = () => {
      let sum = 0;
      document.querySelectorAll("#cpuBars i").forEach((el, i) => { const v = Math.max(3, Math.min(97, (i < 4 ? 40 : 18) + (Math.random() - .5) * 40)); sum += v; el.style.height = v + "%"; });
      const tot = sum / 10; cpuH.push(tot); cpuH.shift();
      const g = Math.max(2, Math.min(95, gpuH[gpuH.length - 1] + (Math.random() - .5) * 6)); gpuH.push(g); gpuH.shift();
      $("#cpuTot").innerHTML = tot.toFixed(0) + "<small>%</small>"; $("#gpuTot").innerHTML = g.toFixed(0) + "<small>%</small>";
      $("#cpuSparkWrap").innerHTML = sparkSVG("cs", cpuH, 100); $("#gpuSparkWrap").innerHTML = sparkSVG("gs", gpuH, 100, "var(--ai)");
      [["device", g], ["renderer", g * 0.95], ["tiler", g * 0.75]].forEach(([k, v]) => { $("#g_" + k).textContent = v.toFixed(0) + "%"; $("#gm_" + k).style.width = v + "%"; });
    };
    tick(); timers.push(setInterval(tick, 1000));
  },
  memory() {
    document.querySelectorAll("[data-quit-mem]").forEach(b => b.onclick = () => { STATE.quit.add(b.dataset.quitMem); toast(`Would quit ${b.dataset.quitMem} (prototype)`); renderNav(); rerender(); });
    $("#quitAllMem").onclick = () => { ["Microsoft Teams", "Slack", "Microsoft Outlook", "Cliq", "Docker"].forEach(n => STATE.quit.add(n)); toast("Would quit 5 idle apps (prototype)"); renderNav(); rerender(); };
    $("#restartBtn").onclick = () => toast("Would show macOS's restart dialog (prototype)");
  },
  storage() {
    const sa = $("#selAll"); sa.indeterminate = STATE.clean.size > 0 && STATE.clean.size < D.clean.length;
    sa.onchange = () => { if (sa.checked) D.clean.forEach(c => STATE.clean.add(c.id)); else STATE.clean.clear(); rerender(); };
    document.querySelectorAll("[data-clean]").forEach(cb => cb.onchange = () => { cb.checked ? STATE.clean.add(cb.dataset.clean) : STATE.clean.delete(cb.dataset.clean); rerender(); });
    $("#cleanBtn").onclick = () => toast("Would ask to confirm, then move the selected items to the Trash (prototype)");
  },
  network() {
    const b = $("#speedBtn"); if (b) b.onclick = startSpeed;
    const c = $("#cancelSpeed"); if (c) c.onclick = () => { clearInterval(speedTimer); Object.assign(STATE.speed, { running: false, phase: -1, series: [] }); rerender(); };
  },
  report() {
    $("#copyRep").onclick = () => navigator.clipboard.writeText($("#rep").value).then(() => toast("Report copied")).catch(() => { $("#rep").select(); toast("Press ⌘C to copy"); });
  }
};

go(STATE.view);
</script>
